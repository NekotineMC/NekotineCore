[versions]
paper = "26.2.build.+"
# Pinned exactly: must match Vi6Clean's locked dev bundle (each build in a composite resolves on its own).
paper-devbundle = "26.2.build.65-beta"
protocollib = "5.5.0-SNAPSHOT"
fawe = "2.15.1-SNAPSHOT"
commandapi = "11.2.+"
junit = "5.14.4-SNAPSHOT"
paperweight = "2.0.0-beta.21"
shadow = "9.4.+"

[libraries]
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
protocollib = { group = "net.dmulloy2", name = "ProtocolLib", version.ref = "protocollib" }
fawe-core = { group = "com.fastasyncworldedit", name = "FastAsyncWorldEdit-Core", version.ref = "fawe" }
fawe-bukkit = { group = "com.fastasyncworldedit", name = "FastAsyncWorldEdit-Bukkit", version.ref = "fawe" }
commandapi = { group = "dev.jorel", name = "commandapi-paper-shade", version.ref = "commandapi" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }

[plugins]
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
